[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-code-review-agent"
version = "0.1.0"
description = "Evidence-grounded AI code and convention reviews"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-agent = "review_agent.cli:main"

[tool.setuptools.packages.find]
include = ["review_agent*"]
